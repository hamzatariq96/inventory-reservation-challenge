services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: inventory
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/inventory
      RESERVATION_TTL_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # Test runners: `docker compose --profile test run --rm backend-tests`
  backend-tests:
    profiles: ["test"]
    build: ./backend
    command: ["pytest", "-p", "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@db:5432/inventory_test
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
