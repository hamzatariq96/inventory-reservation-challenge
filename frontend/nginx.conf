server {
    listen 80;
    root /usr/share/nginx/html;

    # Same /api prefix the Vite dev server proxies, so the frontend code is identical in both setups.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
